name: CI

on:
  push:
  pull_request:

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash install.sh --dir "$RUNNER_TEMP/opencode-skills"

      - name: Verify (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash verify.sh --dir "$RUNNER_TEMP/opencode-skills"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -SkillDir "$env:RUNNER_TEMP/opencode-skills"

      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./verify.ps1 -SkillDir "$env:RUNNER_TEMP/opencode-skills"

  selftest:
    name: selftest
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "opencv-python-headless>=4.10,<4.12" "pillow>=10.4,<11"

      - name: Compile
        run: python -m compileall scripts

      - name: Self-test
        run: python scripts/selftest.py

      - name: CLI help
        run: python scripts/pipeline.py --help
